# 180 Days microsite on Nginx: same rules as .htaccess (which Nginx ignores).
# Only needed if campaign.thedailystar.net runs Nginx. A server admin adds this once.

# 1) In the http {} block:
map $arg_v $hpr_cache_control {
    ""      "no-cache";                               # index.html and anything unversioned
    default "public, max-age=31536000, immutable";    # ?v=<hash> URLs from tools/build.mjs
}

# 2) In the server {} block for campaign.thedailystar.net.
#    "root" is the folder that CONTAINS health-promises-reality/ (the uploaded GitHub folder).

# Project files that are not part of the website.
location ~ ^/health-promises-reality/(tools|deploy|\.git|\.github|\.claude)(/|$) { return 404; }
location ~ ^/health-promises-reality/(README\.md|vercel\.json|\.vercelignore|\.gitignore|\.htaccess)$ { return 404; }

location /health-promises-reality/ {
    root /var/www/campaign;
    index index.html;

    add_header Cache-Control $hpr_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/xml image/svg+xml;
}
